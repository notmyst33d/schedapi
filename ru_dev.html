<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="assets/css/main.css">
    <title>Расписание</title>
</head>

<body>
    <div id="main" class="column" style="padding: 16px;">
        <div class="row" style="align-items: center; margin-bottom: 16px; row-gap: 16px;">
            <img class="product-logo">
            <div class="product-name"></div>
        </div>
        <div class="row" style="padding-bottom: 16px; align-items: center;">
            <div id="header" class="header" style="padding-right: 16px">
                Расписание
            </div>
            <select id="group-select">
                <option value="none">Группа</option>
            </select>
        </div>
        <div class="row" style="padding-bottom: 16px; row-gap: 8px; align-items: center;">
            <div class="week-text" style="padding-right: 8px;">Неделя:</div>
            <input class="week-input" style="margin-right: 8px;" type="number" value="1" min="1" placeholder="Неделя" />
            <button id="week-button-custom" class="primary-button" style="margin-right: 8px;">Получить</button>
            <button id="week-button-current" class="primary-button" style="margin-right: 8px;">Текущая неделя</button>
            <button id="week-button-next" class="primary-button">Следующая неделя</button>
        </div>
        <div id="info-container" class="lesser-header" style="padding-bottom: 16px;">
            Загрузка...
        </div>
        <div id="schedule-container">
        </div>
    </div>
    <script>
        var start = window.location.href.indexOf('api=');
        var end = window.location.href.indexOf('&');
        if (end == -1) {
            end = window.location.href.length;
        }
        var base = window.location.href.substring(start + 4, end);
        var apiUrl = 'https://' + base;
        if (window.fetch == undefined) {
            console.log('Falling back to HTTP');
            apiUrl = 'http://' + base);
        }
        var isMsie = window.navigator.userAgent.indexOf('MSIE') != -1;

        var groupSelect = document.getElementById("group-select");
        var weekInput = document.querySelectorAll(".week-input")[0];
        var weekButtonCustom = document.getElementById("week-button-custom");
        var weekButtonCurrent = document.getElementById("week-button-current");
        var weekButtonNext = document.getElementById("week-button-next");
        var infoContainer = document.getElementById("info-container");
        var scheduleContainer = document.getElementById("schedule-container");
        var productName = document.querySelectorAll(".product-name")[0];
        var productLogo = document.querySelectorAll(".product-logo")[0];

        var oneDay = (60 * 60 * 24) * 1000;
        var oneWeek = oneDay * 7;

        var dayMapping = ['Понедельник', 'Вторник', 'Среда', 'Четверг', 'Пятница', 'Суббота'];
        var monthMapping = ['января', 'февраля', 'марта', 'апреля', 'мая', 'июня', 'июля', 'августа', 'сентября', 'октября', 'ноября', 'декабря'];

        var epochCache = {};

        function addEvent(el, e, f) {
            if (el.attachEvent) {
                return el.attachEvent('on' + e, f);
            } else {
                return el.addEventListener(e, f, false);
            }
        }

        function get(url, cb) {
            var xhr;
            if (isMsie) {
                xhr = new ActiveXObject("Msxml2.XMLHTTP");
            } else {
                xhr = new XMLHttpRequest();
            }
            xhr.open('GET', url);
            xhr.onreadystatechange = function () {
                if (xhr.readyState == 4) {
                    cb(xhr.responseText);
                }
            };
            xhr.send();
        }

        function getJSON(url, cb) {
            get(url, function (data) {
                cb(JSON.parse(data));
            });
        }

        function renderHtmlArray(arr) {
            return arr.join('');
        }

        function renderScheduleRow(entries) {
            if (entries.length == 0) {
                return '';
            }

            var rowsHtml = [];

            for (var i = 0; i < entries.length; i++) {
                rowsHtml.push(renderScheduleEntry(entries[i]));
            }

            return '<div class="row expand-w" style="gap: 16px;">' + renderHtmlArray(rowsHtml) + '</div>';
        }

        function renderScheduleLesson(lesson, index) {
            var lessonType = '';
            var auditorium = '';
            if (lesson.lesson_type != undefined) {
                lessonType = ' ' + lesson.lesson_type.toLowerCase();
            }
            if (lesson.auditorium != undefined) {
                if (lesson.auditorium == 'Актовый зал') {
                    auditorium = ', ' + lesson.auditorium.toLowerCase();
                } else {
                    auditorium = ', аудитория ' + lesson.auditorium.toLowerCase();
                }
            }
            if (lesson.empty != undefined) {
                return '<div>' + index + '. Пусто</div>';
            } else {
                return '<div>' + index + '. ' + lesson.name + lessonType + auditorium + '</div>';
            }
        }

        function renderScheduleEntry(entry) {
            var lessonsHtml = [];

            if (entry.lessons.length == 0) {
                lessonsHtml.push('<div>Пусто</div>');
            }

            for (var i = 0; i < entry.lessons.length; i++) {
                lessonsHtml.push(renderScheduleLesson(entry.lessons[i], i + 1));
            }

            return '<div class="column card">' + '<div class="card-header">' + entry.dayName + '</div>' + renderHtmlArray(lessonsHtml) + '</div>';
        }

        function renderWeekText(week, cb) {
            getEpoch(function (epoch) {
                var weekStartDate = new Date(epoch + (oneWeek * (week - 1)));
                var weekEndDate = new Date(epoch + (oneWeek * (week - 1) + oneDay * 5));
                cb('Неделя ' + week + ', с ' + weekStartDate.getDate() + ' ' + monthMapping[weekStartDate.getMonth()] + ' по ' + weekEndDate.getDate() + ' ' + monthMapping[weekEndDate.getMonth()]);
            });
        }

        function getCurrentWeek(cb) {
            getEpoch(function (epoch) {
                var date = new Date();
                var offset = date.getTimezoneOffset() * 60 * 1000;
                cb(Math.ceil(((date.valueOf() - epoch - offset) / 60 / 60 / 24 / 7) / 1000));
            });
        }

        function updateForWeek(week) {
            infoContainer.innerHTML = 'Получение данных...';
            getJSON(apiUrl + '/schedule?week=' + week + '&group_id=' + groupSelect.value, function (data) {
                var totalLength = 0;
                for (var i = 0; i < data.length; i++) {
                    totalLength += data[i].length;
                }

                if (totalLength == 0) {
                    infoContainer.innerHTML = 'Нет данных на неделю ' + week;
                    scheduleContainer.innerHTML = '';
                    return;
                }

                var entries = [];
                var rowsHtml = [];
                for (var i = 0; i < data.length; i++) {
                    if (entries.length == 2) {
                        rowsHtml.push(renderScheduleRow(entries));
                        entries = [];
                    }

                    if (i == 6) {
                        break;
                    }

                    entries.push({
                        dayName: dayMapping[i],
                        lessons: data[i]
                    });
                }

                scheduleContainer.innerHTML = rowsHtml.join('<div style="padding-bottom: 16px"></div>');
                renderWeekText(week, function (text) {
                    infoContainer.innerHTML = text;
                });
            });
        }

        function getEpoch(cb) {
            var epoch = 0;
            var epochCacheValue = epochCache[groupSelect.value];
            if (epochCacheValue != undefined) {
                cb(epochCacheValue);
            } else {
                getJSON(apiUrl + '/epoch?group_id=' + groupSelect.value, function (data) {
                    epochCache[groupSelect.value] = data.epoch;
                    cb(data.epoch);
                });
            }
        }

        function finalizeSetup() {
            get(apiUrl + '/product/name', function (data) {
                productName.innerHTML = data;
            });
            productLogo.src = apiUrl + '/product/logo.jpg';

            getJSON(apiUrl + '/groups/list', function (data) {
                for (var i = 0; i < data.length; i++) {
                    var option = document.createElement('option');
                    option.value = data[i].id;
                    option.innerHTML = data[i].name;
                    groupSelect.appendChild(option);
                }
                infoContainer.innerHTML = 'Выберите группу в списке';
            });

            addEvent(groupSelect, 'change', function () {
                if (groupSelect.value == 'none') {
                    infoContainer.innerHTML = 'Выберите группу в списке';
                    return;
                }
                getCurrentWeek(function (week) {
                    weekInput.value = week;
                    updateForWeek(week);
                });
            });

            addEvent(weekButtonCustom, 'click', function () {
                if (groupSelect.value == 'none') {
                    infoContainer.innerHTML = 'Выберите группу в списке';
                    return;
                }
                updateForWeek(weekInput.value);
            });

            addEvent(weekButtonCurrent, 'click', function () {
                if (groupSelect.value == 'none') {
                    infoContainer.innerHTML = 'Выберите группу в списке';
                    return;
                }
                getCurrentWeek(function (week) {
                    weekInput.value = week;
                    updateForWeek(week);
                });
            });

            addEvent(weekButtonNext, 'click', function () {
                if (groupSelect.value == 'none') {
                    infoContainer.innerHTML = 'Выберите группу в списке';
                    return;
                }
                getCurrentWeek(function (week) {
                    weekInput.value = week + 1;
                    updateForWeek(week + 1);
                });
            });
        }

        finalizeSetup();
    </script>
</body>

</html>
